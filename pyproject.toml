[project]
name = "app"
version = "0.1.0"
description = ""
authors = [
    {name = "mayconcorreatinti",email = "maycon326754@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.127.0,<0.128.0)",
    "mysql-connector-python (>=9.5.0,<10.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "ruff (>=0.14.13,<0.15.0)",
    "pymongo (>=4.16.0,<5.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "redis[hiredis] (>=7.1.1,<8.0.0)",
    "boto3 (>=1.40.10,<2.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.0,<9.0.0"
pytest-asyncio = ">=0.25.0,<1.0.0"
testcontainers = {version = ">=4.9.0,<5.0.0", extras = ["mysql", "mongo", "redis"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "integration: testes de integracao com Testcontainers",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 78

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true